name: Build and publish Foundry faction module
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify persistent builder UI
        run: |
          node tests/persistent-dialog.mjs
          node tests/faction-menu.mjs
      - name: Verify module sources
        run: |
          node --check scripts/h0d-faction-builder.js
          node --check scripts/h0d-caravanes-stats.js
          node tests/caravanes-stats.mjs
          node tests/caravanes-ordinary-migration.mjs
          node --check scripts/h0d-council-unique.js
          node tests/conseil-unique.mjs
          node --check scripts/h0d-faction-menu.js
          node tests/contextual-menu.mjs
          node tests/perception-sync.mjs
          node --check scripts/h0d-pillards-rouges.js
          node tests/pillards-rouges.mjs
          node tests/pillards-menu.mjs
          python3 -m json.tool data/pillards-rouges.json > /dev/null
          python3 -m json.tool module.json > /dev/null
          python3 -m json.tool data/caravanes-libres.json > /dev/null
          python3 -m json.tool data/conseil-dent-ambre.json > /dev/null
          python3 -c 'import json; d=json.load(open("data/caravanes-libres.json")); assert len(d["profils"]) == 14; assert sum(len(p["actions"]) for p in d["profils"]) == 89'
      - name: Package and publish module
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("module.json"))["version"])')
          TAG="$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Version $TAG déjà publiée"; exit 0; fi
          zip -q -r h0d-faction-builder.zip module.json scripts data assets README.md CHANGELOG.md INSTALL-FORGE.txt
          gh release create "$TAG" h0d-faction-builder.zip module.json data/caravanes-libres.json data/pillards-rouges.json --target "$GITHUB_SHA" --title "H0D Faction Builder v$TAG" --notes-file CHANGELOG.md
